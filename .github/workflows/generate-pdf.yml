name: Gerar apresentação PDF

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Gerar PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências (memories/session)
        working-directory: memories/session
        run: npm install

      - name: Gerar PDF
        working-directory: memories/session
        run: npm run generate-pdf

      - name: Upload do PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: apresentacao-nutri-chedid-pdf
          path: memories/session/apresentacao-nutri-chedid.pdf
